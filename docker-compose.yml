services:
  network-init:
    build:
      context: ./server
      dockerfile: Dockerfile.network-init
    image: jurius/token-network-init:local
    container_name: jurius-token-network-init
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      VH_DUMMY_INTERFACE: ${VH_DUMMY_INTERFACE:-jurius-token}
      VH_BIND_ADDRESS: ${VH_BIND_ADDRESS:-10.254.75.75}
      VH_PRIVATE_PREFIX: ${VH_PRIVATE_PREFIX:-32}
      VH_TCP_PORT: ${VH_TCP_PORT:-7575}
    volumes:
      - /dev/bus/usb:/dev/bus/usb:ro
    security_opt:
      - no-new-privileges:true

  virtualhere:
    build:
      context: ./server
      args:
        VH_SHA256: ${VH_SHA256:-}
    image: jurius/virtualhere-server:local
    container_name: jurius-token-virtualhere
    restart: unless-stopped
    network_mode: host
    cap_add:
      - SYS_ADMIN
    environment:
      VH_SERVER_NAME: ${VH_SERVER_NAME:-Jurius Token Office}
      VH_BIND_ADDRESS: ${VH_BIND_ADDRESS:-10.254.75.75}
      VH_TCP_PORT: ${VH_TCP_PORT:-7575}
      VH_ALLOWED_DEVICES: ${VH_ALLOWED_DEVICES:?Informe o VID/PID em VH_ALLOWED_DEVICES}
      VH_AUTO_ATTACH_TO_KERNEL: ${VH_AUTO_ATTACH_TO_KERNEL:-0}
      VH_CLAIM_PORTS: ${VH_CLAIM_PORTS:-0}
    volumes:
      - virtualhere_config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      - /sys/bus/usb:/sys/bus/usb:rw
      - /sys/devices:/sys/devices:rw
    device_cgroup_rules:
      - "c 189:* rwm"
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    depends_on:
      network-init:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: jurius-token-cloudflared
    profiles: ["cloudflare"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    security_opt:
      - no-new-privileges:true

volumes:
  virtualhere_config:
